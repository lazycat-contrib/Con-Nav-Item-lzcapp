min_os_version: 1.3.8
name: Con-Nav-Item
package: community.lazycat.app.con-nav-item
version: 0.1.0
description: "现代化个人导航站"
homepage: https://github.com/zczy-k/Con-Nav-Item
author: zczy-k
application:
  subdomain: con-nav-item
  background_task: true
  public_path:
    - /

  upstreams:
    - location: /
      backend: http://con-nav-item:3000/

services:
  con-nav-item:
    # ghcr.io/zczy-k/con-nav-item:main
    image: registry.lazycat.cloud/czyt/zczy-k/con-nav-item:a0d4c3d2bfa55c5a
    container_name: con-nav-item
    binds:
      - /lzcapp/var/data:/app/database
      - /lzcapp/var/backups:/app/backups

    environment:
      - PORT=3000 # 监听端口
      - NODE_ENV=production # 运行环境
      - ADMIN_USERNAME={{.U.admin_username}} # 后台用户名
      - ADMIN_PASSWORD={{.U.admin_password}} # 后台密码
      - JWT_SECRET={{ stable_secret "jwt#secret" }} # JWT密钥（必须修改！）

locales:
  zh:
    name: "ConNavItem"
    description: "现代化个人导航站"
  en:
    name: "ConNavItem"
    description: "Modern Personal Navigation Site"
