params:
  - id: admin_username
    type: string
    name: "admin user name"
    description: "the user name to login the backend"
    default_value: "admin"
    optional: false

  - id: admin_password
    type: secret
    name: "admin password"
    description: "the password to login the backend"
    default_value: "$random(len=20)"
    optional: false

locales:
  zh:
    admin_username:
      name: "管理员用户名"
      description: "管理员用户名"

    admin_password:
      name: "管理员密码"
      description: "管理员密码"
